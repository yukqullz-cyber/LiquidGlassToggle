name: Build dylib

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassToggle-dylib
          path: .theos/obj/debug/LiquidGlassToggle.dylib
